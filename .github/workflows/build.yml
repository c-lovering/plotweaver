# Builds Plotweaver for Windows (portable zip + installer) and Linux (AppImage).
# Push a tag like v0.4.0 to build and publish a GitHub Release; or run it by hand
# from the Actions tab to just get the files as downloadable artifacts.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Version
        id: ver
        shell: bash
        run: |
          v=$(python packaging/windows/make_version_info.py | tr -d '\r')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$v" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} doesn't match __version__ $v in plotweaver/__init__.py"
            exit 1
          fi
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm plotweaver.spec
      - name: Portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $dir = "dist/Plotweaver-$v-portable"
          Copy-Item -Recurse dist/Plotweaver $dir
          Copy-Item packaging/windows/portable.txt $dir
          Compress-Archive -Path $dir -DestinationPath "dist/Plotweaver-$v-windows-portable.zip"
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" packaging\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            dist/*-windows-portable.zip
            dist/*-Setup.exe

  linux:
    runs-on: ubuntu-22.04   # older glibc, so the AppImage runs on more distros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries Qt needs (bundled into the AppImage)
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libegl1
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm plotweaver.spec
      - name: Smoke test (starts, runs 5 seconds)
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 5 dist/Plotweaver/Plotweaver
          code=$?
          [ $code -eq 124 ] || { echo "::error::Plotweaver exited early with code $code"; exit 1; }
      - name: AppImage
        run: packaging/linux/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: dist/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
